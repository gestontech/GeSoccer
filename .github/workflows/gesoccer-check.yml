name: GeSoccer - Check & Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-build:
    name: GeSoccer Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4

      - name: Show environment
        run: |
          echo "===== Node ====="
          node --version

          echo "===== npm ====="
          npm --version

      - name: Clean previous installation
        run: |
          rm -rf node_modules
          rm -rf dist
          rm -rf .expo
          rm -rf "$HOME/.expo"
          rm -rf "$HOME/.cache/metro"

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund

      - name: Verify Expo dependencies
        run: |
          echo "===== Expo ====="
          npm ls expo expo-router --depth=0

          echo ""
          echo "===== React ====="
          npm ls react react-dom react-native --depth=0

          echo ""
          echo "===== Metro ====="
          npm ls \
            metro \
            metro-babel-transformer \
            metro-cache \
            metro-cache-key \
            metro-config \
            metro-core \
            metro-file-map \
            metro-minify-terser \
            metro-resolver \
            metro-runtime \
            metro-source-map \
            metro-symbolicate \
            metro-transform-plugins \
            metro-transform-worker

      - name: Verify Metro versions
        run: |
          node <<'NODE'
          const packages = [
            "metro",
            "metro-babel-transformer",
            "metro-cache",
            "metro-cache-key",
            "metro-config",
            "metro-core",
            "metro-file-map",
            "metro-minify-terser",
            "metro-resolver",
            "metro-runtime",
            "metro-source-map",
            "metro-symbolicate",
            "metro-transform-plugins",
            "metro-transform-worker"
          ];

          const expected = "0.83.8";

          let failed = false;

          for (const name of packages) {
            const pkg = require(`${name}/package.json`);

            console.log(`${name}: ${pkg.version}`);

            if (pkg.version !== expected) {
              console.error(
                `ERROR: ${name} doit être ${expected}, trouvé ${pkg.version}`
              );
              failed = true;
            }
          }

          if (failed) {
            process.exit(1);
          }

          console.log("");
          console.log("Metro 0.83.8: OK");
          NODE

      - name: Verify image-size is removed
        run: |
          if npm ls image-size --all 2>/dev/null; then
            echo "ERROR: image-size est encore présent dans l'arbre Metro."
            exit 1
          fi

          echo "image-size absent: OK"

      - name: Verify Expo Router asset
        run: |
          node <<'NODE'
          const fs = require("fs");

          const asset = require.resolve(
            "expo-router/assets/unmatched.png"
          );

          const buffer = fs.readFileSync(asset);

          console.log("Asset:", asset);
          console.log("Bytes:", buffer.length);

          const expected = "89504e470d0a1a0a";
          const actual = buffer
            .subarray(0, 8)
            .toString("hex");

          console.log("PNG signature:", actual);

          if (actual !== expected) {
            throw new Error(
              "expo-router/assets/unmatched.png n'est pas un PNG valide."
            );
          }

          console.log("Expo Router PNG: OK");
          NODE

      - name: Verify Metro configuration
        run: |
          node <<'NODE'
          const config = require("./metro.config.js");

          if (!config) {
            throw new Error(
              "metro.config.js n'a pas pu être chargé."
            );
          }

          if (!config.resolver) {
            throw new Error(
              "Metro resolver absent."
            );
          }

          console.log(
            "Metro configuration loaded successfully."
          );
          NODE

      - name: Expo Doctor
        run: |
          npx expo-doctor

      - name: Validate Expo configuration
        run: |
          npx expo config --type public

      - name: Clean build caches
        run: |
          rm -rf dist
          rm -rf .expo
          rm -rf node_modules/.cache
          rm -rf "$HOME/.expo"
          rm -rf "$HOME/.cache/metro"

      - name: Export Expo web
        env:
          EXPO_NO_DOTENV: "1"
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          npx expo export \
            --platform web \
            --clear

      - name: Verify web build
        run: |
          if [ ! -d "dist" ]; then
            echo "ERROR: le dossier dist/ n'existe pas."
            exit 1
          fi

          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html n'existe pas."
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "       GE SOCCER WEB BUILD OK"
          echo "======================================"
          echo ""

          find dist \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -200

      - name: Upload web build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gesoccer-web-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
