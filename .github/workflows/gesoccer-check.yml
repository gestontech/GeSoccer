name: GeSoccer - Check & Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-build:
    name: Check Expo / Metro / Web Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm

      - name: Show Node and npm versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund

      - name: Verify Expo dependency tree
        run: |
          echo "===== Expo ====="
          npm ls expo expo-router --depth=0 || true

          echo ""
          echo "===== React ====="
          npm ls react react-dom react-native --depth=0 || true

          echo ""
          echo "===== Metro ====="
          npm ls metro metro-config metro-resolver @expo/metro-config --all || true

          echo ""
          echo "===== image-size ====="
          npm ls image-size --all || true

      - name: Inspect Expo Router unmatched asset
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const asset = require.resolve(
            "expo-router/assets/unmatched.png"
          );

          const buffer = fs.readFileSync(asset);

          console.log("Asset:", asset);
          console.log("Size:", buffer.length, "bytes");
          console.log(
            "PNG signature:",
            buffer.subarray(0, 8).toString("hex")
          );

          if (
            buffer.length < 8 ||
            buffer.subarray(0, 8).toString("hex") !==
              "89504e470d0a1a0a"
          ) {
            throw new Error(
              "expo-router/assets/unmatched.png n'est pas un PNG valide."
            );
          }

          console.log("PNG asset OK.");
          NODE

      - name: Expo Doctor
        run: |
          npx expo-doctor

      - name: Clean Metro and Expo caches
        run: |
          rm -rf dist
          rm -rf .expo
          rm -rf node_modules/.cache
          rm -rf "$HOME/.expo"
          rm -rf "$HOME/.cache/metro"

      - name: Verify Metro configuration
        run: |
          node <<'NODE'
          const config = require("./metro.config.js");

          console.log("Metro configuration loaded successfully.");

          console.log(
            "unstable_enablePackageExports:",
            config.resolver?.unstable_enablePackageExports
          );

          console.log(
            "experimentalImportSupport:",
            config.transformer?.getTransformOptions
              ? "configured"
              : "default"
          );
          NODE

      - name: Export Expo web
        env:
          EXPO_NO_DOTENV: "1"
        run: |
          npx expo export \
            --platform web \
            --clear

      - name: Verify dist output
        run: |
          if [ ! -d "dist" ]; then
            echo "ERROR: dist/ n'a pas été généré."
            exit 1
          fi

          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html n'a pas été généré."
            exit 1
          fi

          echo "===== dist ====="
          find dist -maxdepth 2 -type f | sort | head -200

          echo ""
          echo "Build Expo Web réussi."

      - name: Upload web build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gesoccer-web-dist
          path: dist/
          if-no-files-found: warn
